# Vendored, locally patched fork of https://github.com/kemokempo/egui_term
# @ 31bbc7ab8503c9518fcee5717cfa29011e59f451 (branch "main").
# Patched here to add Kitty keyboard protocol support (see src/view.rs and
# src/backend/mod.rs) since the upstream fork is read-only to this project.

[package]
name = "egui_term"
description = "Terminal emulator widget powered by EGUI framework and alacritty terminal backend."
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
repository = "https://github.com/Harzu/egui_term"
categories = ["gui"]
license = "MIT"

[dependencies]
egui = "0.35"
alacritty_terminal = "0.26"
anyhow = "1.0.100"
open = "5.3.2"
