[package]
name = "termview"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }
egui = "0.35"
emath = "0.35"
epaint = "0.35"
egui_term = { git = "https://github.com/kemokempo/egui_term", branch = "main" }
alacritty_terminal = "0.26"

clap = { version = "4", features = ["derive"] }
shell-words = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

tray-icon = "0.14.0"
winit = "0.30"
libc = "0.2"
objc2 = "0.5.1"

# Locally patched copy of egui_term (vendor/egui_term) with Kitty keyboard
# protocol support added. The fork below is read-only to this project, so
# fixes are vendored here instead of being pushed upstream.
[patch."https://github.com/kemokempo/egui_term"]
egui_term = { path = "vendor/egui_term" }
